<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans TC", sans-serif; }
      .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, monospace; }
    </style>
  </defs>

  <!-- Background: 2md-style warm canvas -->
  <rect width="1200" height="630" fill="#fff0cc"/>

  <!-- Subtle canvas grain/dots or card surface -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#fff9e8" stroke="#ddc58b" stroke-width="2"/>

  <!-- Top saffron decorative strip -->
  <path d="M 68 40 L 1132 40 Q 1160 40 1160 68 L 1160 48 L 40 48 L 40 68 Q 40 40 68 40 Z" fill="#ff7600"/>

  <!-- Left: 888 TG view Brand Badge -->
  <g transform="translate(100, 155)">
    <!-- Badge Box -->
    <rect width="320" height="240" rx="36" fill="#ff7600" stroke="#142436" stroke-width="12"/>
    <!-- 888 Number -->
    <text x="160" y="145" text-anchor="middle" class="font-sans" font-size="140" font-weight="900" fill="#0b1a29" letter-spacing="-4">888</text>
    <!-- TG VIEW Text -->
    <text x="160" y="205" text-anchor="middle" class="font-sans" font-size="46" font-weight="800" fill="#0b1a29" letter-spacing="4">TG VIEW</text>
  </g>

  <!-- Right: Content Information -->
  <g transform="translate(470, 0)">
    <!-- Eyebrow Chip -->
    <rect x="0" y="145" width="260" height="34" rx="17" fill="#fff0cc" stroke="#ddc58b" stroke-width="1.5"/>
    <text x="130" y="168" text-anchor="middle" class="font-mono" font-size="14" font-weight="700" fill="#a9471d" letter-spacing="1">TELEGRAM READER</text>

    <!-- Main Title -->
    <text x="0" y="240" class="font-sans" font-size="48" font-weight="800" fill="#17324d" letter-spacing="-1">888 Telegram 頻道瀏覽器</text>

    <!-- Lead / Subtitle -->
    <text x="0" y="295" class="font-sans" font-size="24" font-weight="600" fill="#2b251a">把公開頻道內容，讀成清晰優雅的時間線</text>
    <text x="0" y="335" class="font-sans" font-size="18" font-weight="500" fill="#5e523b">免登入閱讀 · 日曆歸檔 · 廣告智能過濾 · 雙語支援</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 375)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#fff0cc" stroke="#ddc58b" stroke-width="1.5"/>
      <text x="65" y="24" text-anchor="middle" class="font-sans" font-size="15" font-weight="700" fill="#17324d">日曆歸檔</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="130" height="38" rx="8" fill="#fff0cc" stroke="#ddc58b" stroke-width="1.5"/>
      <text x="210" y="24" text-anchor="middle" class="font-sans" font-size="15" font-weight="700" fill="#17324d">廣告過濾</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="130" height="38" rx="8" fill="#fff0cc" stroke="#ddc58b" stroke-width="1.5"/>
      <text x="355" y="24" text-anchor="middle" class="font-sans" font-size="15" font-weight="700" fill="#17324d">快速跳轉</text>

      <!-- Pill 4 -->
      <rect x="435" y="0" width="130" height="38" rx="8" fill="#fff0cc" stroke="#ddc58b" stroke-width="1.5"/>
      <text x="500" y="24" text-anchor="middle" class="font-sans" font-size="15" font-weight="700" fill="#17324d">雙語介面</text>
    </g>

    <!-- Bottom URL Link -->
    <text x="0" y="480" class="font-mono" font-size="20" font-weight="700" fill="#17324d">telegram.david888.com</text>
  </g>
</svg>
